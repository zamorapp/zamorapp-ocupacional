# Avisos de la campana al celular (plazos de accidentes, resultados, alertas, exámenes por vencer): cada 15 minutos,
# todos los días, llama a /api/avisos/campana en Vercel, que envía las notificaciones push nuevas. Así llegan aunque
# nadie abra zamorApp ni la laptop esté encendida. Repo público: minutos sin límite. Sin secretos: la clave vive en Vercel.
name: Avisos al celular

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: avisos-celular
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enviar avisos nuevos
        run: |
          curl -sS --max-time 60 -w "\nHTTP %{http_code} · %{time_total}s\n" "https://zamorapp-ocupacional.vercel.app/api/avisos/campana"
      # Constancias automáticas a RR. HH.: la base decide a qué empresa ya le toca su correo del día (una vez al día)
      - name: Correo diario de constancias
        run: |
          curl -sS --max-time 70 -w "\nHTTP %{http_code} · %{time_total}s\n" "https://zamorapp-ocupacional.vercel.app/api/envios/constancias-dia"
      # Tasa BCV del día siguiente (el BCV la publica a las 4–5 p. m.): solo va al BCV si falta; el resto de las veces
      # responde «al día» sin salir de Vercel. Si falla, la tasa se puede escribir a mano en Facturación.
      - name: Tasa BCV
        run: |
          curl -sS --max-time 45 -w "\nHTTP %{http_code} · %{time_total}s\n" "https://zamorapp-ocupacional.vercel.app/api/tasa-bcv" || true
