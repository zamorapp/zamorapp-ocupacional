# Programa de escritorio para Windows: prueba la puerta local con PostgreSQL y PostgREST reales
# y arma el instalador. Corre en ramas escritorio/*, en PR que tocan la base o el escritorio, o a mano.
name: Escritorio (Windows)

on:
  push:
    branches: ["escritorio/**"]
  # Un cambio en la base o en el programa de escritorio que llega por otro PR también debe probarse aquí
  pull_request:
    paths: ["supabase/migrations/**", "escritorio/**", ".github/workflows/escritorio.yml"]
  workflow_dispatch:

concurrency:
  group: escritorio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # Las ramas escritorio/* ya corren por push: su PR no repite la corrida
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'escritorio/')
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PG_VERSION: "16.4-1"
      POSTGREST_VERSION: "v12.2.3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Motor local (PostgreSQL portátil, PostgREST y Node)
        shell: pwsh
        run: |
          $r = "escritorio/recursos"
          New-Item -ItemType Directory -Force "$r/pgsql", "$r/postgrest", "$r/node" | Out-Null
          Invoke-WebRequest "https://get.enterprisedb.com/postgresql/postgresql-$env:PG_VERSION-windows-x64-binaries.zip" -OutFile "$env:RUNNER_TEMP/pg.zip"
          Expand-Archive "$env:RUNNER_TEMP/pg.zip" -DestinationPath "$env:RUNNER_TEMP/pgtmp"
          foreach ($d in "bin", "lib", "share") { Copy-Item -Recurse "$env:RUNNER_TEMP/pgtmp/pgsql/$d" "$r/pgsql/$d" }
          Invoke-WebRequest "https://github.com/PostgREST/postgrest/releases/download/$env:POSTGREST_VERSION/postgrest-$env:POSTGREST_VERSION-windows-x64.zip" -OutFile "$env:RUNNER_TEMP/pgrest.zip"
          Expand-Archive "$env:RUNNER_TEMP/pgrest.zip" -DestinationPath "$env:RUNNER_TEMP/pgresttmp"
          Get-ChildItem -Recurse "$env:RUNNER_TEMP/pgresttmp" | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host
          $exe = Get-ChildItem -Recurse "$env:RUNNER_TEMP/pgresttmp" -Filter "postgrest*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No se encontró postgrest.exe en el zip" }
          Copy-Item $exe.FullName "$r/postgrest/postgrest.exe"
          Copy-Item (Get-Command node).Source "$r/node/node.exe"
          & "$r/pgsql/bin/postgres.exe" --version
          & "$r/postgrest/postgrest.exe" --version

      - name: Base de prueba "nube" con las migraciones reales
        shell: pwsh
        run: |
          $bin = (Resolve-Path escritorio/recursos/pgsql/bin).Path
          "nube" | Out-File -Encoding ascii -NoNewline "$env:RUNNER_TEMP/pw.txt"
          & "$bin/initdb.exe" -D "$env:RUNNER_TEMP/nube" -U postgres -A scram-sha-256 --pwfile="$env:RUNNER_TEMP/pw.txt" -E UTF8 --locale=C | Out-Null
          & "$bin/pg_ctl.exe" start -D "$env:RUNNER_TEMP/nube" -w -l "$env:RUNNER_TEMP/nube.log" -o "-p 55400 -c listen_addresses=127.0.0.1"
          $env:PGPASSWORD = "nube"
          function Q { & "$bin/psql.exe" -h 127.0.0.1 -p 55400 -U postgres -v ON_ERROR_STOP=1 -q @args; if ($LASTEXITCODE) { throw "psql $args" } }
          Q -c "create database zamorapp_prueba"
          Q -d zamorapp_prueba -f supabase/pruebas/00_stubs_supabase.sql
          Get-ChildItem supabase/migrations/*.sql | Sort-Object Name | ForEach-Object { Q -1 -d zamorapp_prueba -f $_.FullName | Out-Null }
          Q -d zamorapp_prueba -f supabase/pruebas/10_datos.sql

      - name: Pruebas de la puerta local (PostgreSQL y PostgREST reales)
        shell: pwsh
        timeout-minutes: 10
        working-directory: escritorio
        run: |
          npm ci
          # Como en la PC de Cesar: sin ningún PostgreSQL del sistema en el PATH (el programa debe traer todo lo suyo)
          $env:PATH = ($env:PATH -split ";" | Where-Object { $_ -notmatch "postgres|pgsql" }) -join ";"
          $env:PG_BIN = (Resolve-Path recursos/pgsql/bin).Path
          $env:ZAMORAPP_POSTGREST = (Resolve-Path recursos/postgrest/postgrest.exe).Path
          $env:NUBE_DB = "postgresql://postgres:nube@127.0.0.1:55400/zamorapp_prueba"
          node --test --test-reporter=spec "pruebas/*.test.mjs"
          $codigo = $LASTEXITCODE
          Get-ChildItem $env:TEMP -Directory -Filter "zamorapp-*" | ForEach-Object { Get-ChildItem $_.FullName -Filter *.log | ForEach-Object { Write-Host "== $($_.Name)"; Get-Content $_.FullName -Tail 40 } }
          if ($codigo) { throw "Fallaron las pruebas de la puerta" }

      - name: App en modo escritorio (Next autónomo)
        shell: pwsh
        env:
          ZAMORAPP_ESCRITORIO: "1"
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local
        run: |
          npm ci
          npx next build
          if ($LASTEXITCODE) { throw "Falló la compilación de la app" }
          $r = "escritorio/recursos"
          Copy-Item -Recurse .next/standalone "$r/app"
          Copy-Item -Recurse .next/static "$r/app/.next/static"
          Copy-Item -Recurse public "$r/app/public"
          Copy-Item -Recurse supabase/migrations "$r/migraciones"
          Copy-Item supabase/pruebas/00_stubs_supabase.sql "$r/stubs.sql"
          New-Item -ItemType Directory -Force "$r/puerta" | Out-Null
          Copy-Item -Recurse escritorio/puerta "$r/puerta/puerta"
          Copy-Item -Recurse escritorio/base "$r/puerta/base"
          Copy-Item escritorio/package.json, escritorio/package-lock.json "$r/puerta/"
          Push-Location "$r/puerta"; npm ci --omit=dev; Pop-Location

      - name: Instalador (Tauri, NSIS por usuario, sin permisos de administrador)
        shell: pwsh
        working-directory: escritorio
        env:
          ZAMORAPP_NUBE_URL: ${{ vars.ZAMORAPP_NUBE_URL }}
          ZAMORAPP_NUBE_ANON: ${{ vars.ZAMORAPP_NUBE_ANON }}
        run: |
          if (-not $env:ZAMORAPP_NUBE_URL) { Write-Warning "Sin ZAMORAPP_NUBE_URL: el instalador no podrá conectarse a la nube" }
          npx --yes @tauri-apps/cli@2 icon ../public/icono-512.png
          npx --yes @tauri-apps/cli@2 build
          if ($LASTEXITCODE) { throw "Falló el instalador" }

      # Prueba de humo del instalador real: instala sin preguntas, abre el programa como lo haría Cesar
      # y exige que la puerta y la app respondan. Así un instalador que no arranca nunca llega a su PC.
      - name: Instalar y abrir el programa (prueba de humo)
        shell: pwsh
        timeout-minutes: 10
        env:
          ZAMORAPP_NUBE_URL: ${{ vars.ZAMORAPP_NUBE_URL }}
        run: |
          # Acceso directo de Cesar a la app web (Chrome --app): ni instalar ni desinstalar puede tocarlo
          $escritorio = [Environment]::GetFolderPath("Desktop")
          $menu = "$env:APPDATA/Microsoft/Windows/Start Menu/Programs"
          $ajenos = "$escritorio/zamorApp Ocupacional.lnk", "$menu/zamorApp Ocupacional.lnk"
          $shell = New-Object -ComObject WScript.Shell
          foreach ($l in $ajenos) { $a = $shell.CreateShortcut($l); $a.TargetPath = "C:\Windows\notepad.exe"; $a.Save() }
          $setup = Get-ChildItem escritorio/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $dir = Get-ChildItem $env:LOCALAPPDATA -Directory -Filter "zamorApp Escritorio" | Select-Object -First 1
          if (-not $dir) { throw "El instalador no creó la carpeta del programa" }
          foreach ($l in $ajenos) { if ((New-Object -ComObject WScript.Shell).CreateShortcut($l).TargetPath -notmatch "notepad") { throw "El instalador pisó $l" } }
          foreach ($p in "recursos/puerta/puerta/index.mjs", "recursos/app/server.js", "recursos/app/.next/static", "recursos/pgsql/bin/postgres.exe", "recursos/postgrest/postgrest.exe", "recursos/node/node.exe") {
            if (-not (Test-Path (Join-Path $dir.FullName $p))) { throw "Falta $p en la instalación (¿recursos aplanados?)" }
          }
          # Como en la PC de Cesar: sin ningún PostgreSQL del sistema en el PATH (el programa debe traer todo lo suyo)
          $env:PATH = ($env:PATH -split ";" | Where-Object { $_ -notmatch "postgres|pgsql" }) -join ";"
          $exe = Get-ChildItem $dir.FullName -Filter *.exe | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          $proc = Start-Process $exe.FullName -PassThru
          $ok = $false
          try {
            for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
              Start-Sleep 2
              if ($proc.HasExited) { break }
              try {
                $estado = Invoke-RestMethod http://127.0.0.1:54331/zamorapp/estado -TimeoutSec 3
                $app = Invoke-WebRequest http://127.0.0.1:54332/login -TimeoutSec 10 -UseBasicParsing -MaximumRedirection 0 -SkipHttpErrorCheck
                if ($app.StatusCode -lt 500) { $ok = $true; Write-Host "Puerta: $($estado | ConvertTo-Json -Compress) · App: HTTP $($app.StatusCode)" }
              } catch { }
            }
          } finally {
            Write-Host "== arranque.log"; Get-Content "$env:LOCALAPPDATA/zamorApp/arranque.log" -ErrorAction SilentlyContinue
            Write-Host "== puerta.log"; Get-Content "$env:LOCALAPPDATA/zamorApp/datos/puerta.log" -Tail 40 -ErrorAction SilentlyContinue
            Stop-Process -Id $proc.Id -ErrorAction SilentlyContinue
            Start-Sleep 5
            Get-Process node, postgres, postgrest -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          if (-not $ok) { throw "El programa instalado no arrancó" }
          $desinstalar = Get-ChildItem $dir.FullName -Filter "uninstall*.exe" | Select-Object -First 1
          Start-Process $desinstalar.FullName -ArgumentList "/S" -Wait
          Start-Sleep 5
          foreach ($l in $ajenos) { if (-not (Test-Path $l)) { throw "El desinstalador borró $l" } }
          Write-Host "Accesos directos de la app web intactos tras instalar y desinstalar"

      - uses: actions/upload-artifact@v4
        with:
          name: zamorapp-instalador-windows
          path: escritorio/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
