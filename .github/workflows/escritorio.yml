# Prueba de humo del programa de escritorio para Windows: arma el instalador real, lo instala encima de la
# versión anterior, lo abre 6 veces, prueba una PC nueva, el ingreso por la ventana, las descargas y la
# actualización automática. Cuesta ~34 min cobrables del plan gratuito (Windows cuenta doble), por eso corre
# SOLO: a mano (workflow_dispatch), cuando un PR pide revisión o deja de ser borrador, y al llegar a main.
# Las pruebas baratas (base, puerta, compilación) corren en cada envío en escritorio-linux.yml.
name: Escritorio (Windows)

on:
  push:
    branches: ["main"]
    paths: ["supabase/migrations/**", "escritorio/**", ".github/workflows/escritorio.yml"]
  pull_request:
    types: [ready_for_review, review_requested]
    paths: ["supabase/migrations/**", "escritorio/**", ".github/workflows/escritorio.yml"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar esta versión como actualización (solo desde main)"
        type: boolean
        default: false

concurrency:
  group: escritorio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read # para bajar el instalador anterior en la prueba de reinstalación
    env:
      PG_VERSION: "16.4-1"
      POSTGREST_VERSION: "v12.2.3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Motor local (PostgreSQL portátil, PostgREST y Node)
        shell: pwsh
        run: |
          $r = "escritorio/recursos"
          New-Item -ItemType Directory -Force "$r/pgsql", "$r/postgrest", "$r/node" | Out-Null
          Invoke-WebRequest "https://get.enterprisedb.com/postgresql/postgresql-$env:PG_VERSION-windows-x64-binaries.zip" -OutFile "$env:RUNNER_TEMP/pg.zip"
          Expand-Archive "$env:RUNNER_TEMP/pg.zip" -DestinationPath "$env:RUNNER_TEMP/pgtmp"
          foreach ($d in "bin", "lib", "share") { Copy-Item -Recurse "$env:RUNNER_TEMP/pgtmp/pgsql/$d" "$r/pgsql/$d" }
          Invoke-WebRequest "https://github.com/PostgREST/postgrest/releases/download/$env:POSTGREST_VERSION/postgrest-$env:POSTGREST_VERSION-windows-x64.zip" -OutFile "$env:RUNNER_TEMP/pgrest.zip"
          Expand-Archive "$env:RUNNER_TEMP/pgrest.zip" -DestinationPath "$env:RUNNER_TEMP/pgresttmp"
          Get-ChildItem -Recurse "$env:RUNNER_TEMP/pgresttmp" | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host
          $exe = Get-ChildItem -Recurse "$env:RUNNER_TEMP/pgresttmp" -Filter "postgrest*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No se encontró postgrest.exe en el zip" }
          Copy-Item $exe.FullName "$r/postgrest/postgrest.exe"
          Copy-Item (Get-Command node).Source "$r/node/node.exe"
          & "$r/pgsql/bin/postgres.exe" --version
          & "$r/postgrest/postgrest.exe" --version

      - name: Base de prueba "nube" con las migraciones reales
        shell: pwsh
        run: |
          $bin = (Resolve-Path escritorio/recursos/pgsql/bin).Path
          "nube" | Out-File -Encoding ascii -NoNewline "$env:RUNNER_TEMP/pw.txt"
          & "$bin/initdb.exe" -D "$env:RUNNER_TEMP/nube" -U postgres -A scram-sha-256 --pwfile="$env:RUNNER_TEMP/pw.txt" -E UTF8 --locale=C | Out-Null
          & "$bin/pg_ctl.exe" start -D "$env:RUNNER_TEMP/nube" -w -l "$env:RUNNER_TEMP/nube.log" -o "-p 55400 -c listen_addresses=127.0.0.1"
          $env:PGPASSWORD = "nube"
          function Q { & "$bin/psql.exe" -h 127.0.0.1 -p 55400 -U postgres -v ON_ERROR_STOP=1 -q @args; if ($LASTEXITCODE) { throw "psql $args" } }
          Q -c "create database zamorapp_prueba"
          Q -d zamorapp_prueba -f supabase/pruebas/00_stubs_supabase.sql
          Get-ChildItem supabase/migrations/*.sql | Sort-Object Name | ForEach-Object { Q -1 -d zamorapp_prueba -f $_.FullName | Out-Null }
          Q -d zamorapp_prueba -f supabase/pruebas/10_datos.sql

      - name: Pruebas de la puerta local (PostgreSQL y PostgREST reales)
        shell: pwsh
        timeout-minutes: 10
        working-directory: escritorio
        run: |
          npm ci
          # Como en la PC de Cesar: sin ningún PostgreSQL del sistema en el PATH (el programa debe traer todo lo suyo)
          $env:PATH = ($env:PATH -split ";" | Where-Object { $_ -notmatch "postgres|pgsql" }) -join ";"
          $env:PG_BIN = (Resolve-Path recursos/pgsql/bin).Path
          $env:ZAMORAPP_POSTGREST = (Resolve-Path recursos/postgrest/postgrest.exe).Path
          $env:NUBE_DB = "postgresql://postgres:nube@127.0.0.1:55400/zamorapp_prueba"
          node --test --test-reporter=spec "pruebas/*.test.mjs"
          $codigo = $LASTEXITCODE
          Get-ChildItem $env:TEMP -Directory -Filter "zamorapp-*" | ForEach-Object { Get-ChildItem $_.FullName -Filter *.log | ForEach-Object { Write-Host "== $($_.Name)"; Get-Content $_.FullName -Tail 40 } }
          if ($codigo) { throw "Fallaron las pruebas de la puerta" }

      - name: App en modo escritorio (Next autónomo)
        shell: pwsh
        env:
          ZAMORAPP_ESCRITORIO: "1"
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local
        run: |
          npm ci
          npx next build
          if ($LASTEXITCODE) { throw "Falló la compilación de la app" }
          $r = "escritorio/recursos"
          Copy-Item -Recurse .next/standalone "$r/app"
          Copy-Item -Recurse .next/static "$r/app/.next/static"
          Copy-Item -Recurse public "$r/app/public"
          Copy-Item -Recurse supabase/migrations "$r/migraciones"
          Copy-Item supabase/pruebas/00_stubs_supabase.sql "$r/stubs.sql"
          New-Item -ItemType Directory -Force "$r/puerta" | Out-Null
          Copy-Item -Recurse escritorio/puerta "$r/puerta/puerta"
          Copy-Item -Recurse escritorio/base "$r/puerta/base"
          Copy-Item escritorio/package.json, escritorio/package-lock.json "$r/puerta/"
          Push-Location "$r/puerta"; npm ci --omit=dev; Pop-Location

      - name: Instalador (Tauri, NSIS por usuario, sin permisos de administrador)
        shell: pwsh
        working-directory: escritorio
        env:
          ZAMORAPP_NUBE_URL: ${{ vars.ZAMORAPP_NUBE_URL }}
          ZAMORAPP_NUBE_ANON: ${{ vars.ZAMORAPP_NUBE_ANON }}
          # Llave pública de las actualizaciones (variable) y llave privada para firmarlas (secreto, solo al publicar)
          ZAMORAPP_UPDATER_PUBKEY: ${{ vars.ZAMORAPP_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref == 'refs/heads/main' && inputs.publicar && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && inputs.publicar && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if (-not $env:ZAMORAPP_NUBE_URL) { Write-Warning "Sin ZAMORAPP_NUBE_URL: el instalador no podrá conectarse a la nube" }
          # El instalador siempre sale firmado (así la prueba de humo prueba una actualización de verdad). Con la llave
          # real solo al publicar desde main; en cualquier otra corrida, con una llave de prueba de un solo uso.
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            if (-not $env:ZAMORAPP_UPDATER_PUBKEY) { throw "Falta la variable ZAMORAPP_UPDATER_PUBKEY (llave pública de las actualizaciones)" }
            $pub = $env:ZAMORAPP_UPDATER_PUBKEY
          } else {
            npx --yes @tauri-apps/cli@2 signer generate --ci -w "$env:RUNNER_TEMP/prueba.key"
            if ($LASTEXITCODE) { throw "No se pudo generar la llave de prueba" }
            $env:TAURI_SIGNING_PRIVATE_KEY = (Get-Content "$env:RUNNER_TEMP/prueba.key" -Raw).Trim()
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ""
            $pub = (Get-Content "$env:RUNNER_TEMP/prueba.key.pub" -Raw).Trim()
            Write-Host "Instalador firmado con una llave de prueba (no es una publicación)"
          }
          "LLAVE_ACTUALIZACIONES_PRUEBA=$pub" >> $env:GITHUB_ENV  # la prueba de humo la usa como llave de prueba
          # Versión 0.1.<número de corrida>: cada instalador es una versión nueva (se ve en el título de la ventana,
          # en arranque.log y en el nombre del setup), y el programa instalado sabe cuándo hay una más nueva
          $version = "0.1.$env:GITHUB_RUN_NUMBER"
          Write-Host "Versión del instalador: $version"
          # La llave pública también va en la configuración (el empaquetador la exige para firmar). El programa usa la
          # grabada en ZAMORAPP_UPDATER_PUBKEY; una llave de prueba aquí no le da confianza a nada en una PC real.
          # dangerousInsecureTransportProtocol: la prueba 3b sirve latest.json por http://127.0.0.1 y el plugin rechaza http en
          # compilaciones release. El endpoint real sigue siendo https y el de prueba solo se usa cuando la nube es 127.0.0.1.
          @{ version = $version; bundle = @{ createUpdaterArtifacts = $true }; plugins = @{ updater = @{ pubkey = $pub; dangerousInsecureTransportProtocol = $true } } } | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8 src-tauri/ajustes-ci.json
          npx --yes @tauri-apps/cli@2 icon ../public/icono-512.png
          npx --yes @tauri-apps/cli@2 build --config src-tauri/ajustes-ci.json
          if ($LASTEXITCODE) { throw "Falló el instalador" }
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not (Test-Path "$($exe.FullName).sig")) { throw "El instalador no quedó firmado" }

      # Prueba de humo del instalador real, como lo vive Cesar: primero la versión anterior (el último instalador
      # que pasó este CI) con sus datos, luego la nueva instalada ENCIMA, y se abre y cierra varias veces seguidas.
      # Así una falla intermitente al arrancar o una reinstalación que rompe los datos nunca llega a su PC.
      - name: Instalar y abrir el programa (prueba de humo)
        shell: pwsh
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Acceso directo de Cesar a la app web (Chrome --app): ni instalar ni desinstalar puede tocarlo
          $escritorio = [Environment]::GetFolderPath("Desktop")
          $menu = "$env:APPDATA/Microsoft/Windows/Start Menu/Programs"
          $ajenos = "$escritorio/zamorApp Ocupacional.lnk", "$menu/zamorApp Ocupacional.lnk"
          $shell = New-Object -ComObject WScript.Shell
          foreach ($l in $ajenos) { $a = $shell.CreateShortcut($l); $a.TargetPath = "C:\Windows\notepad.exe"; $a.Save() }
          # Como en la PC de Cesar: sin ningún PostgreSQL del sistema en el PATH (el programa debe traer todo lo suyo)
          $env:PATH = ($env:PATH -split ";" | Where-Object { $_ -notmatch "postgres|pgsql" }) -join ";"
          $registros = "$env:LOCALAPPDATA/zamorApp"
          New-Item -ItemType Directory -Force capturas | Out-Null

          # Nube simulada en esta misma máquina (sobre la base "nube" de prueba), para entrar con usuarios de prueba.
          # El programa instalado la usa solo porque ZAMORAPP_NUBE_URL apunta a 127.0.0.1 (en una PC real se ignora).
          $env:NUBE_DB = "postgresql://postgres:nube@127.0.0.1:55400/zamorapp_prueba"; $env:PUERTO = "55500"
          $env:ZAMORAPP_POSTGREST = (Resolve-Path escritorio/recursos/postgrest/postgrest.exe).Path  # REST real, como la nube
          $nube = Start-Process node -ArgumentList "escritorio/pruebas/nube-cli.mjs" -PassThru -NoNewWindow -RedirectStandardOutput capturas/nube.log -RedirectStandardError capturas/nube.err
          $env:ZAMORAPP_NUBE_URL = "http://127.0.0.1:55500"
          # La ventana WebView2 se maneja por CDP, como lo haría una persona (prueba de ingreso real). El puerto lo abre
          # el programa solo cuando también apunta a la nube de prueba (WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS no surte efecto).
          $env:ZAMORAPP_PUERTO_DEPURACION = "9333"

          function Instalar($setup) {
            Start-Process $setup -ArgumentList "/S" -Wait
            $script:dir = Get-ChildItem $env:LOCALAPPDATA -Directory -Filter "zamorApp Escritorio" | Select-Object -First 1
            if (-not $script:dir) { throw "El instalador no creó la carpeta del programa" }
            foreach ($l in $ajenos) { if ((New-Object -ComObject WScript.Shell).CreateShortcut($l).TargetPath -notmatch "notepad") { throw "El instalador pisó $l" } }
          }

          # Abre el programa, espera la puerta y la app, y lo cierra como Cesar (cerrando la ventana)
          # -ui: además registra la PC (si hace falta) y entra por la ventana real hasta ver el panel
          function Abrir([string]$que, [bool]$cors = $false, [bool]$ui = $false) {
            $exe = Get-ChildItem $script:dir.FullName -Filter *.exe | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
            $inicio = Get-Date
            $proc = Start-Process $exe.FullName -PassThru
            $ok = $false
            try {
              for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
                Start-Sleep 2
                if ($proc.HasExited) { break }
                try {
                  $estado = Invoke-RestMethod http://127.0.0.1:54331/zamorapp/estado -TimeoutSec 3
                  $app = Invoke-WebRequest http://127.0.0.1:54332/login -TimeoutSec 10 -UseBasicParsing -MaximumRedirection 0 -SkipHttpErrorCheck
                  if ($app.StatusCode -lt 500) { $ok = $true; Write-Host "$que listo en $([int]((Get-Date) - $inicio).TotalSeconds) s · Puerta: $($estado | ConvertTo-Json -Compress) · App: HTTP $($app.StatusCode)" }
                } catch { }
              }
              if ($ok -and $ui) {
                # ¿El WebView2 de zamorApp abrió el puerto de depuración? (lo pide ZAMORAPP_PUERTO_DEPURACION)
                $web = Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Where-Object { $_.CommandLine -match "zamorapp" -and $_.CommandLine -notmatch "--type=" }
                Write-Host "   WebView2 de zamorApp: $(@($web).Count) proceso(s); con puerto de depuración: $(@($web | Where-Object CommandLine -match 'remote-debugging-port').Count)"
                try { Write-Host "   CDP 9333: $((Invoke-RestMethod http://127.0.0.1:9333/json/version -TimeoutSec 3).Browser)" } catch { Write-Host "   CDP 9333 no responde: $($_.Exception.Message)" }
                $base = "capturas/" + ($que -replace "[^a-z0-9]+", "-")
                $prueba = Start-Process node -ArgumentList "escritorio/pruebas/ui-ventana.mjs --cdp http://127.0.0.1:9333 --correo admin@x --clave clave-admin --registrar `"PC de prueba`" --captura $base.png" -Wait -PassThru -NoNewWindow -RedirectStandardOutput "$base.salida.txt" -RedirectStandardError "$base.errores.txt"
                Get-Content "$base.salida.txt", "$base.errores.txt" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "   $_" }
                if ($prueba.ExitCode) { $ok = $false; Write-Host "::error::$que : el ingreso por la ventana falló (ver capturas/)" }
              }
              if ($ok -and $cors) {
                # La pantalla de ingreso (54332) debe poder hablarle a la puerta (54331) con las cabeceras reales de supabase-js
                $r = Invoke-WebRequest "http://127.0.0.1:54331/auth/v1/token?grant_type=password" -Method Options -UseBasicParsing -SkipHttpErrorCheck -Headers @{
                  Origin = "http://127.0.0.1:54332"; "Access-Control-Request-Method" = "POST"; "Access-Control-Request-Headers" = "apikey,authorization,content-type,x-client-info,x-supabase-api-version" }
                if ($r.StatusCode -ne 204 -or "$($r.Headers['Access-Control-Allow-Headers'])" -notmatch "x-supabase-api-version") { $ok = $false; Write-Host "::error::La pantalla de ingreso no podría hablar con la puerta (CORS)" }
              }
            } finally {
              if (-not $ok) {
                foreach ($l in "arranque.log", "datos/puerta.log", "datos/app.log", "datos/base.log") {
                  Write-Host "== $l"; Get-Content "$registros/$l" -Tail 60 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "   $_" }
                }
              }
              # Cerrar la ventana: el programa debe detener la base y PostgREST con calma y no dejar procesos vivos
              [void]$proc.CloseMainWindow()
              if (-not $proc.WaitForExit(40000)) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; Write-Host "::warning::$que no se cerró con la ventana" }
              # Solo cuentan los procesos del programa (el PostgreSQL "nube" de las pruebas sigue vivo y no es suyo).
              # La base puede tardar unos segundos en cerrar con calma; cuenta lo que siga vivo a los 30 s.
              $propios = { Get-Process node, postgres, postgrest -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$($script:dir.FullName)*" } }
              for ($s = 0; $s -lt 30 -and (& $propios); $s++) { Start-Sleep 1 }
              $vivos = & $propios
              if ($vivos) {
                Write-Host "::error::Tras cerrar $que quedaron procesos vivos: $(($vivos | ForEach-Object Name | Sort-Object -Unique) -join ', ')"
                $vivos | Stop-Process -Force -ErrorAction SilentlyContinue
                $ok = $false
              }
              # El navegador interno (WebView2) tarda unos segundos en morir tras cerrar el programa; si la próxima
              # apertura lo encuentra vivo, se le pega y no abre el puerto de depuración de la prueba de ventana
              $webVivo = { Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Where-Object CommandLine -match "zamorapp" }
              for ($s = 0; $s -lt 20 -and (& $webVivo); $s++) { Start-Sleep 1 }
              if (& $webVivo) { Write-Host "::warning::El WebView2 de $que seguía vivo a los 20 s; se cierra a la fuerza"; & $webVivo | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue } }
            }
            # Solo $ok sale de la función: en PowerShell todo lo que una función deja en la salida se vuelve su valor
            return [bool]$ok
          }

          # 1) Versión anterior (lo que Cesar ya tiene), con sus datos. Si no arranca no importa: es la vieja.
          $previa = gh run list --repo $env:GITHUB_REPOSITORY --workflow escritorio.yml --status success --limit 10 --json databaseId --jq ".[].databaseId" 2>$null |
            Where-Object { $_ -ne "$env:GITHUB_RUN_ID" } | Select-Object -First 1
          if ($previa) {
            gh run download $previa --repo $env:GITHUB_REPOSITORY --name zamorapp-instalador-windows --dir previa 2>$null
          }
          $setupPrevio = Get-ChildItem previa/*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setupPrevio) {
            # Los artefactos duran 3 días: si no hay, se usa la última versión publicada (lo que Cesar tiene de verdad)
            gh release download --repo gestionesaguamiel-web/zamorapp-descargas --pattern "*.exe" --dir previa 2>$null
            $setupPrevio = Get-ChildItem previa/*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($setupPrevio) { $previa = "última publicada" }
          }
          if ($setupPrevio) {
            Write-Host "Versión anterior: corrida $previa ($($setupPrevio.Name))"
            Instalar $setupPrevio.FullName
            [void](Abrir "versión anterior")
            if (-not (Test-Path "$registros/datos/base/PG_VERSION")) { Write-Host "::warning::La versión anterior no dejó datos locales" }
          } else { Write-Host "::warning::No se encontró un instalador anterior; se prueba solo la instalación nueva" }

          # 2) Versión nueva instalada encima, con los datos existentes
          $setup = Get-ChildItem escritorio/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Instalar $setup.FullName
          foreach ($p in "recursos/puerta/puerta/index.mjs", "recursos/app/server.js", "recursos/app/.next/static", "recursos/pgsql/bin/postgres.exe", "recursos/postgrest/postgrest.exe", "recursos/node/node.exe") {
            if (-not (Test-Path (Join-Path $script:dir.FullName $p))) { throw "Falta $p en la instalación (¿recursos aplanados?)" }
          }
          # Instalar encima debe dejar los archivos de ESTA compilación, no los de la anterior
          foreach ($p in "puerta/servidor.mjs", "puerta/motor.mjs", "puerta/index.mjs") {
            $instalado = (Get-FileHash (Join-Path $script:dir.FullName "recursos/puerta/$p")).Hash
            if ($instalado -ne (Get-FileHash "escritorio/$p").Hash) { throw "Instalar encima no reemplazó $p" }
          }
          if ((Get-Content (Join-Path $script:dir.FullName "recursos/app/.next/BUILD_ID")) -ne (Get-Content .next/BUILD_ID)) { throw "Instalar encima no reemplazó la app" }

          # 3) Se abre y cierra 6 veces seguidas: todas deben arrancar (una falla intermitente no pasa)
          $fallas = 0
          for ($n = 1; $n -le 6; $n++) { if (-not (Abrir "apertura $n de 6" ($n -eq 1) ($n -eq 1 -or $n -eq 6))) { $fallas++ } }
          Write-Host "== Relanzamientos de PostgREST registrados:"; Select-String -Path "$registros/datos/puerta.log" -Pattern "se cerró|se vuelve a lanzar" -ErrorAction SilentlyContinue | ForEach-Object Line
          if ($fallas) { throw "El programa instalado no arrancó en $fallas de 6 aperturas" }

          # 3b) Actualización automática, como la vivirá Cesar: el programa instalado encuentra una versión "nueva" en un
          # servidor de prueba (este mismo instalador, anunciado como 0.1.<corrida+1>), la descarga, verifica la firma,
          # la instala sin preguntar (solo en pruebas) y se vuelve a abrir solo. El servidor la anuncia una sola vez.
          $versionNueva = "0.1.$([int]$env:GITHUB_RUN_NUMBER + 1)"
          $servidor = Start-Process node -ArgumentList "escritorio/pruebas/actualizacion-cli.mjs --setup `"$($setup.FullName)`" --version $versionNueva" -PassThru -NoNewWindow -RedirectStandardOutput capturas/actualizacion.log -RedirectStandardError capturas/actualizacion.err
          $env:ZAMORAPP_ACTUALIZACIONES_URL = "http://127.0.0.1:55600/latest.json"
          $env:ZAMORAPP_ACTUALIZACIONES_LLAVE = $env:LLAVE_ACTUALIZACIONES_PRUEBA
          $env:ZAMORAPP_ACTUALIZAR_SIN_PREGUNTAR = "1"
          $desde = @(Get-Content "$registros/arranque.log" -ErrorAction SilentlyContinue).Count
          $nuevo = { @(Get-Content "$registros/arranque.log" -ErrorAction SilentlyContinue | Select-Object -Skip $desde) }
          $exe = Get-ChildItem $script:dir.FullName -Filter *.exe | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          $proc = Start-Process $exe.FullName -PassThru
          $ok = $false
          try {
            # 1. El programa anuncia que la descargó y verificó (20 s de espera inicial + descarga local)
            for ($i = 0; $i -lt 90 -and -not $ok; $i++) { Start-Sleep 2; if ((& $nuevo) -match "actualización descargada y verificada") { $ok = $true } }
            if (-not $ok) { throw "El programa no encontró o no descargó la actualización de prueba en 180 s" }
            Write-Host "actualización: descargada y verificada con la firma"
            # 2. Se cierra solo y el instalador lo vuelve a abrir
            if (-not $proc.WaitForExit(60000)) { throw "El programa no se cerró para instalar la actualización" }
            $ok = $false
            for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
              Start-Sleep 2
              $lineas = & $nuevo
              if (($lineas -match "abriendo").Count -ge 2 -and ($lineas -match "app lista").Count -ge 1) { $ok = $true }
            }
            if (-not $ok) { throw "El programa no se volvió a abrir tras instalar la actualización" }
            $relanzado = Get-Process zamorapp -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$($script:dir.FullName)*" } | Select-Object -First 1
            if (-not $relanzado) { throw "El programa actualizado no está corriendo" }
            Write-Host "actualización: instalada y el programa se volvió a abrir solo (versión $((& $nuevo | Select-String 'versión del instalador' | Select-Object -Last 1).Line))"
            [void]$relanzado.CloseMainWindow()
            if (-not $relanzado.WaitForExit(40000)) { Stop-Process -Id $relanzado.Id -Force -ErrorAction SilentlyContinue; Write-Host "::warning::El programa actualizado no se cerró con la ventana" }
          } finally {
            if (-not $ok) { Write-Host "== arranque.log (actualización)"; & $nuevo | ForEach-Object { Write-Host "   $_" }; Write-Host "== servidor de prueba"; Get-Content capturas/actualizacion.log, capturas/actualizacion.err -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "   $_" } }
            Get-Process zamorapp -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $servidor.Id -ErrorAction SilentlyContinue
            Remove-Item Env:ZAMORAPP_ACTUALIZACIONES_URL, Env:ZAMORAPP_ACTUALIZACIONES_LLAVE, Env:ZAMORAPP_ACTUALIZAR_SIN_PREGUNTAR -ErrorAction SilentlyContinue
            Start-Sleep 10
          }

          # 4) PC nueva (o reinstalación tras un daño): sin datos previos, el primer arranque también debe funcionar
          $desinstalar = Get-ChildItem $script:dir.FullName -Filter "uninstall*.exe" | Select-Object -First 1
          Start-Process $desinstalar.FullName -ArgumentList "/S" -Wait
          Start-Sleep 5
          Remove-Item -Recurse -Force "$registros/datos" -ErrorAction SilentlyContinue
          Instalar $setup.FullName
          if (-not (Abrir "primer arranque en PC nueva" $false $true)) { throw "El programa no arrancó o no dejó entrar en una PC sin datos" }

          $desinstalar = Get-ChildItem $script:dir.FullName -Filter "uninstall*.exe" | Select-Object -First 1
          Start-Process $desinstalar.FullName -ArgumentList "/S" -Wait
          Start-Sleep 5
          foreach ($l in $ajenos) { if (-not (Test-Path $l)) { throw "El desinstalador borró $l" } }
          Write-Host "Accesos directos de la app web intactos tras instalar, reinstalar encima y desinstalar"
          Stop-Process -Id $nube.Id -ErrorAction SilentlyContinue

      # Capturas de la ventana y registros de la prueba de humo, pase o falle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zamorapp-prueba-ventana
          path: capturas/
          if-no-files-found: ignore
          retention-days: 2

      # Publica la actualización: solo a mano desde main, con la versión ya probada arriba (instalar y abrir).
      - name: Publicar actualización (repo zamorapp-descargas)
        if: github.ref == 'refs/heads/main' && inputs.publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DESCARGAS_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { throw "Falta el secreto DESCARGAS_TOKEN" }
          $v = "0.1.${{ github.run_number }}"
          $exe = Get-ChildItem escritorio/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not (Test-Path "$($exe.FullName).sig")) { throw "El instalador no quedó firmado (¿falta TAURI_SIGNING_PRIVATE_KEY?)" }
          $nombre = "zamorapp-escritorio-$v-setup.exe"
          Copy-Item $exe.FullName $nombre
          $repo = "gestionesaguamiel-web/zamorapp-descargas"
          @{
            version = $v
            notes = "zamorApp Escritorio $v (${{ github.sha }})"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{
              signature = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
              url = "https://github.com/$repo/releases/download/v$v/$nombre"
            } }
          } | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8NoBOM latest.json
          gh release create "v$v" $nombre latest.json --repo $repo --title "zamorApp Escritorio $v" --notes "Versión $v" --latest
          if ($LASTEXITCODE) { throw "No se pudo publicar la versión" }

      - uses: actions/upload-artifact@v4
        with:
          name: zamorapp-instalador-windows
          path: escritorio/src-tauri/target/release/bundle/nsis/*.exe
          # 68 MB por corrida contra 500 MB de cuota (Cesar, 2026-10-27): 3 días. El oficial vive en zamorapp-descargas.
          retention-days: 3
