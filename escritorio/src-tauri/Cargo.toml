[package]
name = "zamorapp"
version = "0.1.0"
description = "zamorApp Ocupacional para escritorio"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"
hex = "0.4"
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

# Windows Hello (huella, rostro o PIN de Windows) para entrar sin escribir la clave
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.2"

[profile.release]
strip = true
lto = true
