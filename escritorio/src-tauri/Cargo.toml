[package]
name = "zamorapp"
version = "0.1.0"
description = "zamorApp Ocupacional para escritorio"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"
hex = "0.4"

[profile.release]
strip = true
lto = true
