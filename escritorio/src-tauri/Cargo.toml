[package]
name = "zamorapp"
version = "0.1.0"
description = "zamorApp Ocupacional para escritorio"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

# Mismas versiones que usa Tauri (wry) para hablar con el WebView2: diálogo de impresión y PDF.
# Windows Hello (huella, rostro o PIN de Windows) usa el mismo crate windows para entrar sin escribir la clave.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-future = "0.3"
rfd = { version = "0.15", default-features = false }

[profile.release]
strip = true
lto = true
