<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>zamorApp Escritorio</title>
  <style>
    :root { --bg: #f5f7f7; --fg: #17262b; --muted: #56686e; --accent: #0d6e74; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1719; --fg: #e3ecee; --muted: #93a7ac; --accent: #4fbcc2; } }
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 16px/1.5 "Segoe UI", system-ui, sans-serif; }
    .c { text-align: center; }
    .anillo { width: 42px; height: 42px; margin: 0 auto 16px; border-radius: 50%;
              border: 4px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent);
              animation: g 0.9s linear infinite; }
    @keyframes g { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .anillo { animation: none; } }
    p { color: var(--muted); margin: 4px 0 0; }
  </style>
</head>
<body>
  <div class="c">
    <div class="anillo" aria-hidden="true"></div>
    <strong>Abriendo zamorApp…</strong>
    <p>Preparando la base de datos de esta PC.</p>
  </div>
</body>
</html>
