<html><head><link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:transparent} svg{display:block}</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
 <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25508f"/><stop offset="1" stop-color="#0d2346"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a8b"/><stop offset="1" stop-color="#e2493a"/></linearGradient>
 <linearGradient id="tealv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd0ea"/><stop offset="1" stop-color="#1a7fa0"/></linearGradient>
 <radialGradient id="fondo" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#1f4c86"/><stop offset="1" stop-color="#0a1c38"/></radialGradient>
 <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <filter id="bisel" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
  <feSpecularLighting in="b" surfaceScale="4" specularConstant=".7" specularExponent="18" lighting-color="#fff" result="s"><fePointLight x="-60" y="-80" z="160"/></feSpecularLighting>
  <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
  <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0"/>
 </filter>
 <filter id="biselt" x="-5%" y="-20%" width="110%" height="140%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="b"/>
  <feSpecularLighting in="b" surfaceScale="1.6" specularConstant=".5" specularExponent="20" lighting-color="#fff" result="s"><fePointLight x="250" y="-120" z="220"/></feSpecularLighting>
  <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
  <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".3" k4="0" result="lit"/>
  <feDropShadow in="lit" dx="0" dy="2" stdDeviation="1.2" flood-color="#0a1c38" flood-opacity=".25"/>
 </filter>
 <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0a1c38" flood-opacity=".35"/></filter>
 <!-- figura: cabeza + brazos en V + cuerpo; centro 0,0 -->
 <g id="figura">
  <circle cx="0" cy="-34" r="15"/>
  <path d="M-42 -54 L-8 2 L8 2 L42 -54" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M0 2 L0 26 M0 26 L-18 56 M0 26 L18 56" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
 </g>
</defs></svg>

<!-- A: escudo biselado, dentro O + figura V -->
<svg id="j" width="720" height="240" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
 <g filter="url(#sombra)"><path d="M120 14 L208 46 L208 114 C208 166 172 202 120 226 C68 202 32 166 32 114 L32 46 Z" fill="url(#navy)" filter="url(#bisel)"/></g>
 <circle cx="120" cy="116" r="66" fill="none" stroke="url(#teal)" stroke-width="16" filter="url(#bisel)"/>
 <use href="#figura" transform="translate(120 122) scale(.78)" fill="#fff" stroke="#fff"/>
 <path d="M120 14 L208 46 L208 90 C160 70 80 70 32 90 L32 46 Z" fill="url(#brillo)"/>
 <text x="250" y="128" font-family="Raleway" font-size="70" font-weight="800" fill="#14325c">Ocupa<tspan fill="#ff6b5b">Vida</tspan></text>
 <text x="253" y="172" font-family="Raleway" font-size="23" font-weight="500" letter-spacing="6" fill="#4d5d73">SALUD OCUPACIONAL</text>
</svg>

<!-- B: círculo oscuro, aro O degradado, figura V degradada -->
<svg id="k" width="720" height="240" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
 <circle cx="120" cy="120" r="104" fill="url(#fondo)" filter="url(#sombra)"/>
 <circle cx="120" cy="120" r="80" fill="none" stroke="url(#teal)" stroke-width="20" filter="url(#bisel)"/>
 <use href="#figura" transform="translate(120 126) scale(.85)" fill="#5fd0ea" stroke="#e9f8fc"/>
 <ellipse cx="104" cy="58" rx="70" ry="28" fill="url(#brillo)"/>
 <text x="250" y="128" font-family="Raleway" font-size="70" font-weight="800" fill="#14325c">Ocupa<tspan fill="#ff6b5b">Vida</tspan></text>
 <text x="253" y="172" font-family="Raleway" font-size="23" font-weight="500" letter-spacing="6" fill="#4d5d73">SALUD OCUPACIONAL</text>
</svg>

<!-- C: escudo partido como el 7 (navy + teal), O blanca, figura navy -->
<svg id="l" width="720" height="240" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
 <g filter="url(#sombra)">
  <path d="M120 14 L208 46 L208 114 C208 166 172 202 120 226 C68 202 32 166 32 114 L32 46 Z" fill="url(#navy)" filter="url(#bisel)"/>
  <path d="M120 34 L190 60 L190 114 C190 156 162 186 120 206 Z" fill="url(#teal)"/>
 </g>
 <circle cx="120" cy="118" r="62" fill="none" stroke="#fff" stroke-width="10" stroke-opacity=".9"/>
 <use href="#figura" transform="translate(120 122) scale(.74)" fill="#fff" stroke="#fff"/>
 <text x="250" y="128" font-family="Raleway" font-size="70" font-weight="800" fill="#14325c">Ocupa<tspan fill="#ff6b5b">Vida</tspan></text>
 <text x="253" y="172" font-family="Raleway" font-size="23" font-weight="500" letter-spacing="6" fill="#4d5d73">SALUD OCUPACIONAL</text>
</svg>

<!-- D: insignia redondeada degradada, O abierta (la figura sale por arriba), cruz al pecho -->
<svg id="m" width="720" height="240" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
 <rect x="18" y="18" width="204" height="204" rx="54" fill="url(#fondo)" filter="url(#sombra)"/>
 <rect x="18" y="18" width="204" height="204" rx="54" fill="url(#brillo)"/>
 <path d="M76 66 A70 70 0 1 0 164 66" fill="none" stroke="url(#teal)" stroke-width="18" stroke-linecap="round" filter="url(#bisel)"/>
 <use href="#figura" transform="translate(120 128) scale(.85)" fill="#fff" stroke="#fff"/>
 <path d="M120 140 v12 M114 146 h12" stroke="#ff6b5b" stroke-width="5" stroke-linecap="round"/>
 <text filter="url(#biselt)" x="250" y="128" font-family="Raleway" font-size="70" font-weight="800" fill="#14325c">Ocupa<tspan fill="#ff6b5b">Vida</tspan></text>
 <text x="253" y="172" font-family="Raleway" font-size="23" font-weight="500" letter-spacing="6" fill="#4d5d73">SALUD OCUPACIONAL</text>
</svg>
<script>document.fonts.ready.then(()=>document.body.dataset.ok=1)</script>
</body></html>
